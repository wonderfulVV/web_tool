<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面未找到 - 汪汪导航</title>
    <meta name="description" content="抱歉，您访问的页面不存在或已被删除。请检查URL是否正确，或返回首页继续浏览。">
    <!-- 使用与网站其他页面相同的CSS资源 -->
    <link rel="stylesheet" href="/assets/css/bootstrap.min-4.3.1.css">
    <link rel="stylesheet" href="/assets/fontawesome-5.15.4/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/style-3.03029.2.css">
    <style>
        body {
            background-color: #f8f9fa;
            color: #343a40;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        
        .error-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            padding: 2rem;
            text-align: center;
        }
        
        .error-number {
            font-size: 8rem;
            font-weight: 700;
            color: #343a40;
            margin: 0;
            line-height: 1;
            opacity: 0.2;
        }
        
        .error-message {
            font-size: 2rem;
            font-weight: 500;
            margin: 1rem 0;
            color: #343a40;
        }
        
        .error-description {
            font-size: 1.1rem;
            color: #6c757d;
            max-width: 500px;
            margin-bottom: 2rem;
        }
        
        .error-actions {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 4px;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background-color: #007bff;
            border: none;
            color: white;
        }
        
        .btn-primary:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
        }
        
        .btn-secondary {
            background-color: #6c757d;
            border: none;
            color: white;
        }
        
        .btn-secondary:hover {
            background-color: #545b62;
            transform: translateY(-2px);
        }
        
        .home-link {
            margin-top: 2rem;
            font-size: 1rem;
            color: #007bff;
            text-decoration: none;
        }
        
        .home-link:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 768px) {
            .error-number {
                font-size: 5rem;
            }
            
            .error-message {
                font-size: 1.5rem;
            }
            
            .error-description {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="/">
                <img src="/assets/images/logo@2x.png" alt="汪汪导航" height="30">
            </a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/pages/stats.html">统计</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/pages/submit_site.html">提交</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/about/">关于</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 错误页面主要内容 -->
    <div class="error-container">
        <div class="error-number">404</div>
        <h1 class="error-message">页面未找到</h1>
        <p class="error-description">
            抱歉，您访问的页面不存在或已被删除。可能是URL输入错误，或者该页面已被移动。
        </p>
        <div class="error-actions">
            <a href="/" class="btn btn-primary">
                <i class="fas fa-home mr-2"></i>返回首页
            </a>
            <a href="/pages/submit_site.html" class="btn btn-secondary">
                <i class="fas fa-plus-circle mr-2"></i>提交网站
            </a>
        </div>
        <a href="/" class="home-link">
            访问汪汪导航首页，发现更多优质资源
        </a>
    </div>

    <!-- 页脚 -->
    <footer class="bg-dark text-white py-4">
        <div class="container text-center">
            <p>© 2025 汪汪导航 - 精选优质网站资源导航</p>
            <p class="text-muted text-sm">
                <a href="/about/" class="text-white text-decoration-none mr-3">关于我们</a>
                <a href="/pages/submit_site.html" class="text-white text-decoration-none mr-3">提交网站</a>
                <a href="/sitemap.xml" class="text-white text-decoration-none">网站地图</a>
            </p>
        </div>
    </footer>

    <!-- 使用与网站其他页面相同的JS资源 -->
    <script src="/assets/js/jquery.min-3.2.1.js"></script>
    <script src="/assets/js/bootstrap.min-4.3.1.js"></script>
    <script>
        // 添加一些简单的动画效果
        document.addEventListener('DOMContentLoaded', function() {
            const errorNumber = document.querySelector('.error-number');
            const errorMessage = document.querySelector('.error-message');
            const errorDescription = document.querySelector('.error-description');
            const errorActions = document.querySelector('.error-actions');
            const homeLink = document.querySelector('.home-link');
            
            // 简单的淡入动画
            setTimeout(() => {
                errorNumber.style.opacity = '0.8';
                errorNumber.style.transition = 'opacity 1s ease';
            }, 300);
            
            setTimeout(() => {
                errorMessage.style.opacity = '1';
                errorMessage.style.transition = 'opacity 1s ease';
            }, 600);
            
            setTimeout(() => {
                errorDescription.style.opacity = '1';
                errorDescription.style.transition = 'opacity 1s ease';
            }, 900);
            
            setTimeout(() => {
                errorActions.style.opacity = '1';
                errorActions.style.transition = 'opacity 1s ease';
            }, 1200);
            
            setTimeout(() => {
                homeLink.style.opacity = '1';
                homeLink.style.transition = 'opacity 1s ease';
            }, 1500);
        });
    </script>
</body>
</html>
